<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 5</title>
</head>
<body>
     <fieldset>
    <h1 align="center">Student Registration Form</h1>
    <hr>

    <form action="submit.html">

        <!-- Full Name Field -->
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        <br><br>

        <!-- Email Field with Validation -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter valid email address" required>
        <br><br>

        <!-- Password Field -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
        <br><br>

        <!-- Gender Radio Buttons -->
        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br><br>

        <!-- Course Dropdown -->
        <label for="course">Course:</label>
        <select id="course" name="course">
            <option value="">-- Select Course --</option>
            <option value="btech">B.Tech</option>
            <option value="bca">BCA</option>
            <option value="mca">MCA</option>
        </select>
        <br><br>

        <!-- Contact Number Field -->
        <label for="contact">Contact No:</label>
        <input type="tel" id="contact" name="contact" placeholder="Enter phone number">
        <br><br>

        <!-- Address Textarea -->
        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="30" placeholder="Enter your address"></textarea>
        <br><br>

        <!-- Action Buttons -->
        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>

    <hr>
    <p style="text-align: center;">&copy; 2025 Student Registration Portal</p>
</fieldset>
</body>
</html>
